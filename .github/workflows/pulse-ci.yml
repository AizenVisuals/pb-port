name: PULSE CI

on:
  push:
    branches: [fan-pack-public]
    tags: ['v*']
  pull_request:
    branches: [fan-pack-public]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Node tests and Android web packaging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Verify Android web bundle packaging
        run: npm run android:package

  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tests
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/fan-pack-public' && (contains(github.event.head_commit.message, '[build-apk]') || contains(github.event.head_commit.message, '[release-apk]'))))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Build Android APK
        run: npm run android:build
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-arena-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Prepare named test APK for release
        if: github.ref == 'refs/heads/fan-pack-public' && contains(github.event.head_commit.message, '[release-apk]')
        run: |
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/PULSE-ARENA-0.8.3-test.1.apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/fan-pack-public' && contains(github.event.head_commit.message, '[release-apk]')))
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'pulse-arena-v0.8.3-test.1' }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref == 'refs/heads/fan-pack-public' && 'PULSE ARENA 0.8.3-test.1 — Ajustes de interface e Water Gun' || github.ref_name }}
          prerelease: ${{ github.ref == 'refs/heads/fan-pack-public' }}
          make_latest: false
          files: ${{ github.ref == 'refs/heads/fan-pack-public' && 'release-files/PULSE-ARENA-0.8.3-test.1.apk' || 'android/app/build/outputs/apk/debug/*.apk' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
